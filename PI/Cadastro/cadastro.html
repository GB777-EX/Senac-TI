<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <main class="container">
        <!-- Indicador de Progresso -->
        <div class="steps-container">
            <div class="step active">
                <span class="step-number">1</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <span class="step-number">2</span>
            </div>
        </div>

        <!-- Formulário -->
        <form class="form-container">
            <!-- Passo 1: Dados Pessoais -->
            <div class="form-section active" id="step1">
                <h3>Dados pessoais</h3>
                <p class="section-subtitle">Passo 1: Informações Pessoais</p>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="firstName">Primeiro Nome <span class="required">*</span></label>
                        <input type="text" id="firstName" placeholder="" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Sobrenome <span class="required">*</span></label>
                        <input type="text" id="lastName" placeholder="" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF <span class="required">*</span></label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="" required>
                </div>

                <div class="form-group">
                    <label for="phone">Telefone <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="form-group">
                    <label for="birthDate">Data de Nascimento <span class="required">*</span></label>
                    <input type="date" id="birthDate" required>
                </div>
            </div>

            <!-- Passo 2: Confirmação e Termos -->
            <div class="form-section" id="step2">
                <h3>Confirmação</h3>
                <p class="section-subtitle">Passo 2: Confirme seus dados</p>

                <div class="confirmation-container">
                    <div class="confirmation-section">
                        <h4>Dados Pessoais</h4>
                        <p><strong>Nome:</strong> <span id="confirmName">-</span></p>
                        <p><strong>CPF:</strong> <span id="confirmCpf">-</span></p>
                        <p><strong>Email:</strong> <span id="confirmEmail">-</span></p>
                        <p><strong>Telefone:</strong> <span id="confirmPhone">-</span></p>
                        <p><strong>Data de Nascimento:</strong> <span id="confirmBirthDate">-</span></p>
                    </div>
                </div>

                <div class="form-group terms-group">
                    <label for="terms" class="terms-label">
                        <input type="checkbox" id="terms">
                        Aceito os termos e condições de uso
                    </label>
                </div>
            </div>

            <!-- Botões de Navegação -->
            <div class="button-group">
                <button type="button" class="btn btn-secondary" id="prevBtn" style="display:none;">Voltar</button>
                <button type="button" class="btn btn-primary" id="nextBtn">Próximo</button>
            </div>
        </form>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
