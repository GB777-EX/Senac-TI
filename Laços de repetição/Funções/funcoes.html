<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funções</title>
    <script>
        let funcaoA = function (A){
            console.log(A)
        }// função anônima
        funcaoA("nome")// chamada da função e passagem de parâmetro

        let funcaoArrow = () =>console.log("teste");
        funcaoArrow()// chamada da função

        let text = " ABCDEFGHIJKLMNOPQRSTUVWXYZ "// funções de string
        let length = text.length;// tamanho da string
        console.log( text + "-" + length );// imprime o tamanho da string
        console.log(text.charAt(12));// caractere na posição 12
        console.log(text.substring(0,5));// substring da posição 0 até a 5
        console.log(text.indexOf("E"));// posição do caractere E
        console.log(text.toLocaleLowerCase());// transforma em minúsculo
        console.log(text.replace("ABCDE", "12345"));// substitui ABCDE por 12345
        console.log(text.trim(text));// remove espaços no início e no fim da string

    // Funções matemáticas
        let x = 10.385;
        console.log(Math.ceil(x));// arredonda para cima
        console.log(Math.round(x));// arredonda para o mais próximo
        console.log(Math.floor(x));// arredonda para baixo
        console.log(Math.random(x));// número aleatório entre 0 e 1

        const day = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];// array de dias da semana

        let data = new Date();// função de data
        console.log(data.getDate());// dia do mês
        console.log(day[data.getDay()]);// dia da semana específico usando constante 
        console.log(data.getMonth() + 1);// mês
        console.log(data.getFullYear());// ano
        console.log(data.getDate() + "/" + (data.getMonth() + 1) + "/" + data.getFullYear());// data completa
    </script>
   
</head>
<body>
    
</body>
</html>
